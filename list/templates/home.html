<!DOCTYPE html>
<html>
<head><title>To-Do App</title></head>
<body>
    <h1>My To-Do List</h1>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Task</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                {{ task.title }} 
                <a href="{% url 'update' task.id %}">Edit</a> 
                <a href="{% url 'delete' task.id %}">Delete</a>
            </li>
        {% empty %}
            <p>No tasks yet!</p>
        {% endfor %}
    </ul>
</body>
</html>
